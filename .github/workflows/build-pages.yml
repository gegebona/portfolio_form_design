# Rebuilds the single-file page whenever the app source changes on main,
# and commits the result to the repo root, which GitHub Pages serves.
name: Build page
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run publish:pages
        working-directory: app
      - name: Commit the built page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git diff --cached --quiet || (git commit -m "Rebuild page" && git push)
